name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-transit-trip-processor
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_EC2_METADATA_DISABLED: 'true'
  SAM_CLI_TELEMETRY: '0'

jobs:
  test:
    name: Run tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests including Floci integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration verify

  sam-validate:
    name: Validate SAM template
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Validate SAM template
        run: sam validate --lint --template-file template.yaml --region "$AWS_REGION"

  deploy:
    name: Deploy SAM stack
    needs: [test, sam-validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Build Lambda
        run: sam build --template-file template.yaml --region "$AWS_REGION"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Deploy
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --config-file "$GITHUB_WORKSPACE/samconfig.toml"
          --region "$AWS_REGION"
          --no-confirm-changeset
          --no-fail-on-empty-changeset
